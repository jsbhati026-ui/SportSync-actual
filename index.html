    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchDesc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                          (window.Window && Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch'));
          if (!fetchDesc || !fetchDesc.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return originalFetch;
              },
              set: function(newFetch) {
                originalFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Gracefully continue
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('only a getter') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
